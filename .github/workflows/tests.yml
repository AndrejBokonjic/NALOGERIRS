name: CI Pipeline

on:
  push:
    branches: [ main, pre-production, production ]
  pull_request:
    branches: [ main, pre-production, production ]

jobs:

  backend-tests:
    name: Python backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests with coverage
        run: |
          cd backend
          pytest tests \
            --cov=backend \
            --cov-report=xml:backend-coverage.xml \
            --cov-report=html:backend-htmlcov

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/backend-coverage.xml
            backend/backend-htmlcov/

  frontend-tests:
    name: React frontend tests
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: gazeProReact/node_modules
          key: node-${{ hashFiles('gazeProReact/package-lock.json') }}

      - name: Install frontend dependencies
        run: |
          cd gazeProReact
          npm ci || npm install

      - name: Run frontend tests with coverage
        run: |
          cd gazeProReact
          npm test

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: gazeProReact/coverage/

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: gazeProReact/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarcloud-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}



  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Prepare backend build
        run: |
          mkdir backend-build
          cp -r backend backend-build/

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend-build/

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: frontend-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          cd gazeProReact
          npm ci || npm install

      - name: Build frontend
        run: |
          cd gazeProReact
          npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: gazeProReact/dist/

  docker-build-push:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/nalogerirs:latest \
            -f backend/Dockerfile \
            backend


      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nalogerirs:latest

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Deploy to Render
        run: echo "Deploy triggered"